<header class="workflow-header">
  <div class="workflow-header__top">
    <h1 class="workflow-header__title">DSG-Demo-Assistant</h1>

    <span class="workflow-header__step" tuiAppearance="outline">
      Шаг {{ currentStepIndex() + 1 }} из {{ steps().length }}
    </span>
  </div>

  <progress
    tuiProgressBar
    class="workflow-header__progress"
    [max]="steps().length"
    [value]="progressValue()"
  ></progress>

  <nav
    tuiStepper
    class="workflow-header__stepper"
    [activeItemIndex]="currentStepIndex()"
  >
    @for (step of steps(); track step.key; let index = $index) {
      <button
        tuiStep
        type="button"
        [disabled]="index > currentStepIndex()"
        [stepState]="stepState(index)"
        (click)="stepSelected.emit(index)"
      >
        {{ step.title }}
      </button>
    }
  </nav>
</header>
