<section class="step-form">
  <h2 class="step-form__title">{{ step().title }}</h2>

  <p class="step-form__question">{{ step().question }}</p>

  <div class="step-form__field">
    @if (step().controlType === 'input') {
      <tui-textfield>
        <input
          tuiTextfield
          [id]="step().key"
          [ngModel]="value()"
          [placeholder]="step().placeholder"
          (ngModelChange)="fieldChanged.emit({ key: step().key, value: $event })"
        />
      </tui-textfield>
    } @else {
      <tui-textfield>
        <textarea
          tuiTextarea
          [id]="step().key"
          [max]="8"
          [min]="4"
          [ngModel]="value()"
          [placeholder]="step().placeholder"
          (ngModelChange)="fieldChanged.emit({ key: step().key, value: $event })"
        ></textarea>
      </tui-textfield>
    }
  </div>

  <footer class="step-form__footer">
    <button
      tuiButton
      appearance="secondary"
      type="button"
      [disabled]="isFirstStep()"
      (click)="back.emit()"
    >
      Назад
    </button>

    <div class="step-form__actions">
      @if (isLastStep()) {
        <button
          tuiButton
          appearance="primary"
          type="button"
          [disabled]="!canMoveForward()"
          (click)="finish.emit()"
        >
          Завершить
        </button>
      } @else {
        <button
          tuiButton
          appearance="primary"
          type="button"
          [disabled]="!canMoveForward()"
          (click)="next.emit()"
        >
          Продолжить
        </button>
      }
    </div>
  </footer>
</section>
