<section
  style="
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  "
>
  <div
    style="
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    "
  >
    <div>
      <p
        style="
          margin: 0 0 0.5rem;
          color: var(--tui-text-secondary);
          font: var(--tui-font-text-s);
          text-transform: uppercase;
          letter-spacing: 0.08em;
        "
      >
        Результат
      </p>
      <h2 style="margin: 0;">Материал для выступления готов</h2>
    </div>

    <button tuiButton appearance="outline" type="button" (click)="restart.emit()">
      Начать заново
    </button>
  </div>

  <div
    style="
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    "
  >
    <article
      tuiAppearance="floating"
      style="
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.25rem;
        border-radius: 1.5rem;
        min-height: 420px;
      "
    >
      <div
        style="
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 1rem;
        "
      >
        <div>
          <p
            style="
              margin: 0 0 0.5rem;
              color: var(--tui-text-secondary);
              font: var(--tui-font-text-s);
              text-transform: uppercase;
              letter-spacing: 0.08em;
            "
          >
            Ваш текст
          </p>
          <h3 style="margin: 0;">Собранная структура</h3>
        </div>

        <button
          tuiIconButton
          appearance="flat"
          size="s"
          type="button"
          aria-label="Скопировать ваш текст"
          (click)="copy.emit('user')"
        >
          <tui-icon [icon]="userCopyIcon()"></tui-icon>
        </button>
      </div>

      <div
        style="
          flex: 1;
          padding: 1rem;
          border-radius: 1.25rem;
          background: rgba(255, 255, 255, 0.72);
          border: 1px solid rgba(27, 31, 59, 0.08);
          overflow: auto;
          display: flex;
          flex-direction: column;
          gap: 1rem;
        "
      >
        @for (step of steps(); track step.key) {
          <section
            style="
              display: flex;
              flex-direction: column;
              gap: 0.5rem;
            "
          >
            <h4 style="margin: 0;">{{ step.title }}</h4>
            <p
              style="
                margin: 0;
                color: var(--tui-text-secondary);
                white-space: pre-wrap;
                line-height: 1.6;
              "
            >
              {{ form()[step.key] }}
            </p>
          </section>
        }
      </div>
    </article>

    <article
      tuiAppearance="floating"
      style="
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.25rem;
        border-radius: 1.5rem;
        min-height: 420px;
      "
    >
      <div
        style="
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 1rem;
        "
      >
        <div>
          <p
            style="
              margin: 0 0 0.5rem;
              color: var(--tui-text-secondary);
              font: var(--tui-font-text-s);
              text-transform: uppercase;
              letter-spacing: 0.08em;
            "
          >
            Помощь Нестора
          </p>
          <h3 style="margin: 0;">Черновик от AI</h3>
        </div>

        <button
          tuiIconButton
          appearance="flat"
          size="s"
          type="button"
          aria-label="Скопировать помощь Нестора"
          [disabled]="!nestorText()"
          (click)="copy.emit('nestor')"
        >
          <tui-icon [icon]="nestorCopyIcon()"></tui-icon>
        </button>
      </div>

      <div
        style="
          flex: 1;
          padding: 1rem;
          border-radius: 1.25rem;
          background: rgba(255, 255, 255, 0.72);
          border: 1px solid rgba(27, 31, 59, 0.08);
          overflow: auto;
        "
      >
        @if (isGenerating()) {
          <div
            style="
              min-height: 100%;
              display: grid;
              place-items: center;
              text-align: center;
            "
          >
            <tui-loader size="l" [showLoader]="true">
              Генерируем подсказки от внутренней модели
            </tui-loader>
          </div>
        } @else {
          <p
            style="
              margin: 0;
              white-space: pre-wrap;
              line-height: 1.6;
            "
          >
            {{ nestorText() }}
          </p>
        }
      </div>
    </article>
  </div>
</section>
