<section class="results-screen">
  <div class="results-screen__header">
    <div>
      <p class="results-screen__caption">Результат</p>
      <h2 class="results-screen__title">Материал для выступления готов</h2>
    </div>

    <button tuiButton appearance="outline" type="button" (click)="restart.emit()">
      Начать заново
    </button>
  </div>

  <div class="results-screen__grid">
    <article class="results-card" tuiAppearance="floating">
      <div class="results-card__header">
        <div>
          <p class="results-screen__caption">Ваш текст</p>
          <h3 class="results-card__title">Собранная структура</h3>
        </div>

        <button
          tuiIconButton
          appearance="flat"
          size="s"
          type="button"
          aria-label="Скопировать ваш текст"
          (click)="copy.emit('user')"
        >
          <tui-icon [icon]="userCopyIcon()"></tui-icon>
        </button>
      </div>

      <div class="results-card__content results-card__content_structured">
        @for (step of steps(); track step.key) {
          <section class="results-card__section">
            <h4 class="results-card__subtitle">{{ step.title }}</h4>
            <p class="results-card__text results-card__text_muted">{{ form()[step.key] }}</p>
          </section>
        }
      </div>
    </article>

    <article class="results-card" tuiAppearance="floating">
      <div class="results-card__header">
        <div>
          <p class="results-screen__caption">Помощь Нестора</p>
          <h3 class="results-card__title">Черновик от AI</h3>
        </div>

        <button
          tuiIconButton
          appearance="flat"
          size="s"
          type="button"
          aria-label="Скопировать помощь Нестора"
          [disabled]="!nestorText()"
          (click)="copy.emit('nestor')"
        >
          <tui-icon [icon]="nestorCopyIcon()"></tui-icon>
        </button>
      </div>

      <div class="results-card__content">
        @if (isGenerating()) {
          <div class="results-card__loader">
            <tui-loader size="l" [showLoader]="true">
              Генерируем подсказки от внутренней модели
            </tui-loader>
          </div>
        } @else {
          <p class="results-card__text">{{ nestorText() }}</p>
        }
      </div>
    </article>
  </div>
</section>
