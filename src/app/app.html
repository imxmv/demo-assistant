<tui-root>
  <main class="page-shell">
    <section class="app-frame" tuiAppearance="floating">
      @if (showWorkflow()) {
        <app-workflow-header
          [steps]="steps"
          [currentStepIndex]="currentStepIndex()"
          [progressValue]="progressValue()"
          (stepSelected)="goToStep($event)"
        />
      }

      @if (screen() === 'welcome') {
        <app-welcome-screen (start)="startFlow()" />
      }

      @if (screen() === 'form') {
        <app-step-form
          [step]="currentStep()"
          [stepIndex]="currentStepIndex()"
          [isFirstStep]="currentStepIndex() === 0"
          [isLastStep]="isLastStep()"
          [value]="currentValue()"
          [canMoveForward]="canMoveForward()"
          (fieldChanged)="updateField($event.key, $event.value)"
          (back)="goBack()"
          (next)="goForward()"
          (finish)="finishFlow()"
          (restart)="restartFlow()"
        />
      }

      @if (screen() === 'result') {
        <app-results-screen
          [steps]="steps"
          [form]="form()"
          [nestorText]="nestorText()"
          [isGenerating]="isGenerating()"
          [userCopyIcon]="copyIcon('user')"
          [nestorCopyIcon]="copyIcon('nestor')"
          (restart)="restartFlow()"
          (copy)="copyText($event)"
        />
      }
    </section>
  </main>
</tui-root>
